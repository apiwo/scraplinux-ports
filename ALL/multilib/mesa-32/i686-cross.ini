[binaries]
c = ['clang', '-m32']
cpp = ['clang++', '-m32']
ar = 'llvm-ar'
strip = 'llvm-strip'
pkg-config = 'pkg-config'

[built-in options]
c_args = []
c_link_args = []
cpp_args = []
cpp_link_args = []

[host_machine]
system = 'linux'
cpu_family = 'x86'
cpu = 'i686'
endian = 'little'

[properties]
pkg_config_libdir = '/usr/lib32/pkgconfig:/usr/lib/pkgconfig:/usr/share/pkgconfig'
